# 公开导出（/export/*）的出口/来源映射 —— 现为「一次性种子」
#
# 背景：同一套 new-api 在不同机器上各有入口，日志目录名（jumper、jumper-003-latest、
# proxy45 …）与对外的服务主机并不是一一对应，且命名带 -latest 之类的后缀。
#
# 【重要】IP 绑定的真相源已改为 log_dir.db 的 sources.ip 列：
#   - 本文件只在「首次给 sources 加 ip 列」时被读一次，把下面 7 条按名字灌进表；
#   - 一旦表里有任何非空 IP，之后就不再读本文件，改这里对运行时没有任何影响；
#   - 要改 IP 请走「数据管理 → 来源与路径」：新增时填「IP」，或在行末菜单选「改 IP」。
#   - 查询走 /export/proxy_list（纯展示，不参与任何过滤）。
#
# 用法：
#   support_proxy: true            保留以兼容旧配置；运行时不再据此做过滤
#   proxies: { "<IP>": "<来源名>" } 主机 → 来源名（与 sources.name 对应）
#   proxies: { "<IP>": [名1, 名2] } 同一个 IP 可以对应多个来源名（见下）
#
# 说明：
#   - 主机键是 URL 里出现的那台机器（用户访问的对外 IP），不是日志里的内网地址。
#   - 来源名要和「数据管理」里登记的 sources.name 一致；对不上的会被跳过，
#     不会让整个接口失败。
#   - 值可以是单个名字，也可以是名字列表：历史原因，同一台机器的数据在 sources 表里
#     可能有新旧两种命名（如 proxy-004 / proxy-004-latest），把两个都列上，
#     任何一个命中都算该 IP 的来源。

support_proxy: true

proxies:
  "115.120.113.66": jumper-003-latest
  "115.120.62.121": jumper-001
  "115.33.106.42": jumper-002
  "115.120.48.151": jumper
  "115.33.106.57": [proxy-004, proxy-004-latest]
  "115.120.127.45": proxy45
  "115.120.50.8": proxy8
