<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key 管理 - 登录</title>
    <link href="/static/css/tokens.css" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/vue.min.js"></script>
    <style>
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            color: var(--foreground);
        }
        .err {
            color: var(--destructive);
            font-size: .9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div id="app" class="standalone-shell">
{% raw %}
    <div class="standalone-card standalone-card-sm">
        <div class="card-title">Key 管理登录</div>
        <div class="mb-3">
            <input v-model="user" class="input" placeholder="用户名" @keyup.enter="submit">
        </div>
        <div class="mb-3">
            <input v-model="password" type="password" class="input" placeholder="密码" @keyup.enter="submit">
        </div>
        <button class="btn btn-primary w-full" @click="submit" :disabled="loading">
            {{ loading ? '登录中...' : '登录' }}
        </button>
        <div v-if="error" class="err">{{ error }}</div>
    </div>
{% endraw %}
</div>
<script>
new Vue({
    el: '#app',
    data: { user: '', password: '', loading: false, error: '' },
    methods: {
        submit() {
            if (!this.password) { this.error = '请输入密码'; return; }
            this.loading = true; this.error = '';
            fetch('/keys', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
                body: JSON.stringify({user: this.user, password: this.password})
            }).then(r => {
                if (!r.ok) return r.json().then(d => { throw new Error(d.detail || '密码错误'); });
                return r.json();
            }).then(() => {
                window.location.href = '/keys';
            }).catch(e => {
                this.error = e.message;
            }).finally(() => { this.loading = false; });
        }
    }
});
</script>
</body>
</html>
