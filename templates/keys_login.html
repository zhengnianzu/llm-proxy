<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key 管理 - 登录</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/js/vue.min.js"></script>
    <style>
        body { background: #f4f6fb; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-box { background: #fff; border-radius: 14px; padding: 32px; box-shadow: 0 8px 24px rgba(15,23,42,.08); max-width: 380px; width: 100%; }
        .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; text-align: center; }
        .err { color: #dc2626; font-size: .9rem; margin-top: 8px; }
    </style>
</head>
<body>
<div id="app">
{% raw %}
    <div class="card-box">
        <div class="card-title">Key 管理登录</div>
        <div class="mb-3">
            <input v-model="user" class="form-control" placeholder="用户名" @keyup.enter="submit">
        </div>
        <div class="mb-3">
            <input v-model="password" type="password" class="form-control" placeholder="密码" @keyup.enter="submit">
        </div>
        <button class="btn btn-primary w-100" @click="submit" :disabled="loading">
            {{ loading ? '登录中...' : '登录' }}
        </button>
        <div v-if="error" class="err">{{ error }}</div>
    </div>
{% endraw %}
</div>
<script>
new Vue({
    el: '#app',
    data: { user: '', password: '', loading: false, error: '' },
    methods: {
        submit() {
            if (!this.password) { this.error = '请输入密码'; return; }
            this.loading = true; this.error = '';
            fetch('/keys', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
                body: JSON.stringify({user: this.user, password: this.password})
            }).then(r => {
                if (!r.ok) return r.json().then(d => { throw new Error(d.detail || '密码错误'); });
                return r.json();
            }).then(() => {
                window.location.href = '/keys';
            }).catch(e => {
                this.error = e.message;
            }).finally(() => { this.loading = false; });
        }
    }
});
</script>
</body>
</html>
