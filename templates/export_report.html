<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>质检报告</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <script src="/static/js/vue.min.js"></script>
    <style>
        body { background: #f4f6fb; color: #1f2937; }
        .page-shell { max-width: 1200px; margin: 0 auto; padding: 24px 16px 40px; }
        .topbar {
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: #fff; padding: 10px 20px; border-radius: 10px; margin-bottom: 16px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .brand-title { font-size: 18px; font-weight: 700; margin: 0; }
        .nav-pills-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-pill {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 6px 12px; border-radius: 999px; text-decoration: none;
            background: rgba(255,255,255,.14); color: #fff; font-weight: 600; font-size: 12px;
            border: 1px solid rgba(255,255,255,.14);
        }
        .nav-pill.active { background: #fff; color: #0f172a; }
        .report-card {
            background: #fff; border-radius: 14px; padding: 28px 32px;
            box-shadow: 0 8px 24px rgba(15,23,42,.06);
        }
        @media (max-width: 768px) { .report-card { padding: 16px; } }

        /* Markdown 渲染 */
        .md-rendered { font-size: .92rem; line-height: 1.7; color: #1f2937; }
        .md-rendered h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 12px; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        .md-rendered h2 { font-size: 1.15rem; font-weight: 700; margin: 24px 0 8px; color: #1e40af; }
        .md-rendered h3 { font-size: 1rem; font-weight: 600; margin: 16px 0 6px; color: #334155; }
        .md-rendered blockquote { background: #f0f9ff; border-left: 3px solid #3b82f6; padding: 10px 16px; margin: 8px 0; font-size: .88rem; color: #475569; border-radius: 0 6px 6px 0; }
        .md-rendered table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: .85rem; }
        .md-rendered th { background: #f1f5f9; font-weight: 600; text-align: left; padding: 8px 10px; border: 1px solid #e2e8f0; white-space: nowrap; position: sticky; top: 0; }
        .md-rendered td { padding: 6px 10px; border: 1px solid #e2e8f0; vertical-align: top; }
        .md-rendered tr:nth-child(even) { background: #f8fafc; }
        .md-rendered tr:hover { background: #eff6ff; }
        .md-rendered p { margin: 6px 0; }
    </style>
</head>
<body>
<div id="app" class="page-shell">
    <div class="topbar">
        <h1 class="brand-title">质检报告</h1>
        <div class="nav-pills-wrap">
            <a class="nav-pill" href="/keys/export">返回导出</a>
            <a class="nav-pill" href="/keys">Key 管理</a>
            <a class="nav-pill" href="/">监控总览</a>
        </div>
    </div>

    <div class="report-card">
        <div v-if="loading" class="text-center text-muted py-5">加载中…</div>
        <div v-else-if="error" class="text-center text-danger py-5">{{ error }}</div>
        <div v-else class="md-rendered" v-html="html"></div>
    </div>
</div>

<script>
new Vue({
    el: '#app',
    data: {
        loading: true,
        error: '',
        html: '',
    },
    mounted: function() {
        var parts = window.location.pathname.split('/');
        var recordId = parts[parts.length - 1];
        if (!recordId || isNaN(recordId)) {
            this.error = '无效的记录 ID';
            this.loading = false;
            return;
        }
        var self = this;
        fetch('/api/export/eval/report/' + recordId, {
            headers: {'X-Requested-With': 'XMLHttpRequest'}
        })
            .then(function(r) {
                if (r.status === 401) { window.location.href = '/keys'; return Promise.reject('auth'); }
                return r.json();
            })
            .then(function(d) {
                if (d.detail) {
                    self.error = d.detail;
                } else {
                    var md = d.report_md || '';
                    self.html = md ? self.renderMarkdown(md) : '<p class="text-muted">报告为空</p>';
                    document.title = '质检报告 #' + recordId;
                }
            })
            .catch(function(e) {
                if (e !== 'auth') self.error = '加载失败: ' + e;
            })
            .finally(function() { self.loading = false; });
    },
    methods: {
        renderMarkdown: function(md) {
            var esc = function(s) {
                return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            };
            var lines = md.split('\n');
            var html = [];
            var inTable = false;
            var i = 0;

            while (i < lines.length) {
                var line = lines[i];

                if (line.indexOf('|') !== -1 && line.trim().charAt(0) === '|') {
                    if (!inTable) {
                        inTable = true;
                        html.push('<table>');
                        var thCells = line.split('|').filter(function(c) { return c.trim() !== ''; });
                        html.push('<thead><tr>');
                        thCells.forEach(function(c) { html.push('<th>' + esc(c.trim()) + '</th>'); });
                        html.push('</tr></thead><tbody>');
                        if (i + 1 < lines.length && /^\|[\s\-:|]+\|/.test(lines[i + 1])) i++;
                        i++;
                        continue;
                    }
                    var tdCells = line.split('|').filter(function(c) { return c.trim() !== ''; });
                    html.push('<tr>');
                    tdCells.forEach(function(c) { html.push('<td>' + esc(c.trim()) + '</td>'); });
                    html.push('</tr>');
                    i++;
                    continue;
                } else if (inTable) {
                    inTable = false;
                    html.push('</tbody></table>');
                }

                if (/^### /.test(line)) { html.push('<h3>' + esc(line.slice(4)) + '</h3>'); i++; continue; }
                if (/^## /.test(line)) { html.push('<h2>' + esc(line.slice(3)) + '</h2>'); i++; continue; }
                if (/^# /.test(line)) { html.push('<h1>' + esc(line.slice(2)) + '</h1>'); i++; continue; }

                if (/^>\s?/.test(line)) {
                    var bq = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        bq.push(esc(lines[i].replace(/^>\s?/, '')));
                        i++;
                    }
                    html.push('<blockquote>' + bq.join('<br>') + '</blockquote>');
                    continue;
                }

                if (line.trim() === '') { i++; continue; }
                html.push('<p>' + esc(line) + '</p>');
                i++;
            }
            if (inTable) html.push('</tbody></table>');
            return html.join('\n');
        },
    }
});
</script>
</body>
</html>
