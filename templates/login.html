<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/static/icon.jpg">
    <title>登录 - LLM Proxy</title>
    <link href="/static/css/tokens.css" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <style>
        .login-form-label {
            font-size: 0.84rem;
            color: var(--foreground);
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }
        .login-input {
            min-height: 44px;
            border-radius: var(--radius-lg);
            font-size: 14px;
        }
        .btn-login {
            width: 100%;
            min-height: 44px;
            border-radius: var(--radius-lg);
            font-weight: 700;
            font-size: 14px;
        }
        .error-box {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: var(--radius-lg);
            background: color-mix(in srgb, var(--destructive) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--destructive) 25%, transparent);
            color: var(--destructive);
            font-size: 0.92rem;
        }
        .success-box {
            margin-bottom: 18px;
            padding: 12px 14px;
            border-radius: var(--radius-lg);
            background: color-mix(in srgb, var(--success) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--success) 25%, transparent);
            color: var(--success);
            font-size: 0.92rem;
        }
    </style>
</head>
<body>
<div class="login-shell">
    <div class="standalone-card standalone-card-sm">
        <div style="text-align:center; margin-bottom: 24px;">
            <div style="display:inline-flex; align-items:center; gap:8px;">
                <span style="width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 8px rgba(59,143,245,0.5);"></span>
                <span style="font-size:15px;font-weight:700;color:var(--foreground);">LLM Proxy</span>
            </div>
        </div>

        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="success-box">{{ success }}</div>
        {% endif %}

        <form method="post" action="/login">
            <input type="hidden" name="next" value="{{ next_path }}">

            <div class="mb-3">
                <label class="login-form-label" for="username">用户名</label>
                <input id="username" name="username" type="text" class="input login-input" autocomplete="username" required autofocus>
            </div>

            <div class="mb-3">
                <label class="login-form-label" for="password">密码</label>
                <input id="password" name="password" type="password" class="input login-input" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-login">登录</button>
        </form>

        <div style="margin-top: 16px; text-align: center; font-size: 0.9rem; color: var(--muted-foreground);">
            没有账号？<a href="/register" style="color: var(--primary); text-decoration: none; font-weight: 600;">注册账号</a>
        </div>
    </div>
</div>
</body>
</html>
