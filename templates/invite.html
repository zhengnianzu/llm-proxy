<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申请 API Key</title>
    <link href="/static/css/tokens.css" rel="stylesheet">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/vue.min.js"></script>
    <style>
        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--foreground);
        }
        .card-sub {
            color: var(--muted-foreground);
            font-size: .9rem;
            margin-bottom: 20px;
        }
        .created-key {
            background: color-mix(in srgb, var(--success) 10%, var(--card));
            border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
            border-radius: var(--radius);
            padding: 14px;
            margin-top: 16px;
        }
        .created-key strong {
            color: var(--foreground);
        }
        .created-key code {
            font-family: var(--font-mono);
            font-size: .95rem;
            word-break: break-all;
            color: var(--foreground);
        }
        .err {
            color: var(--destructive);
            font-size: .9rem;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div id="app" class="standalone-shell">
{% raw %}
    <div class="standalone-card standalone-card-md">
        <div class="card-title">申请 API Key</div>
        <div class="card-sub">输入邀请码获取你的 API Key</div>

        <div v-if="!result">
            <div class="mb-3">
                <label class="form-label text-sm font-semibold">邀请码</label>
                <input v-model="inviteCode" class="input" placeholder="请输入邀请码" @keyup.enter="submit">
            </div>
            <div class="mb-3">
                <label class="form-label text-sm font-semibold">Key 名称（可选）</label>
                <input v-model="name" class="input" placeholder="例如：我的项目">
            </div>
            <button class="btn btn-primary w-full" @click="submit" :disabled="loading">
                {{ loading ? '申请中...' : '申请 Key' }}
            </button>
            <div v-if="error" class="err">{{ error }}</div>
        </div>

        <div v-else>
            <div class="created-key">
                <strong>API Key 已创建，请立即复制保存：</strong>
                <div class="mt-2"><code>{{ result.key }}</code></div>
                <div class="mt-2 text-muted text-sm">名称: {{ result.name || '(unnamed)' }}</div>
                <button class="btn btn-outline btn-sm mt-2" @click="copyKey">复制 Key</button>
            </div>
            <div class="mt-3 text-muted text-sm text-center">刷新页面后将无法再看到完整 Key，请妥善保存。</div>
        </div>
    </div>
{% endraw %}
</div>

<script>
new Vue({
    el: '#app',
    data: { inviteCode: '', name: '', loading: false, error: '', result: null },
    methods: {
        submit() {
            if (!this.inviteCode.trim()) { this.error = '请输入邀请码'; return; }
            this.loading = true; this.error = '';
            fetch('/api/invite', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest'},
                body: JSON.stringify({invite_code: this.inviteCode, name: this.name})
            }).then(r => {
                if (!r.ok) return r.json().then(d => { throw new Error(d.detail || '申请失败'); });
                return r.json();
            }).then(d => {
                this.result = d;
            }).catch(e => {
                this.error = e.message;
            }).finally(() => { this.loading = false; });
        },
        copyKey() {
            navigator.clipboard.writeText(this.result.key).then(() => alert('已复制到剪贴板'));
        }
    }
});
</script>
</body>
</html>
